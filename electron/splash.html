<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gevis AI Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f1117;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo-area {
      margin-bottom: 40px;
      text-align: center;
    }

    .app-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .app-subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-top: 6px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .progress-container {
      width: 280px;
      margin-bottom: 16px;
    }

    .progress-bar-track {
      background: #1f2937;
      border-radius: 4px;
      height: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      width: 0%;
      transition: width 0.4s ease;
    }

    .status-text {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
      letter-spacing: 0.5px;
    }

    .version {
      position: fixed;
      bottom: 20px;
      font-size: 11px;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="logo-area">
    <div class="app-name">Gevis AI Studio</div>
    <div class="app-subtitle">Computer Vision Platform</div>
  </div>

  <div class="progress-container">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">Starting...</div>
  </div>

  <div class="version">v1.0.0</div>

  <script>
    // Called from main.js via executeJavaScript to update splash state
    function updateProgress(percent, message) {
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('statusText').textContent = message;
    }
  </script>
</body>
</html>
